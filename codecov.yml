# Codecov configuration for RDF Vocabularies monorepo
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 70%
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 1%
        informational: true

# Define flags for each package
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: packages-rdf_vocabularies_core
      paths:
        - packages/rdf_vocabularies_core/
    - name: packages-rdf_vocabularies_schema
      paths:
        - packages/rdf_vocabularies_schema/
    - name: packages-rdf_vocabularies_schema_http
      paths:
        - packages/rdf_vocabularies_schema_http/
    - name: packages-rdf_vocabularies
      paths:
        - packages/rdf_vocabularies/

# Ignore patterns
ignore:
  - "**/*.g.dart"
  - "**/generated/**"
  - "doc/**"
  - "tool/**"
  - "example/**"
  - "test/**"
  - "packages/*/test/**"
  - "packages/*/example/**"

# Comment behavior
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Notification settings
github_checks:
  annotations: true
