name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: 
          - packages/rdf_vocabularies_core
          - packages/rdf_vocabularies_schema
          - packages/rdf_vocabularies_schema_http
          - packages/rdf_vocabularies
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      
      - name: Install dependencies for ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: dart pub get
      
      - name: Analyze ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: dart analyze
      
      - name: Run tests for ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: dart test --coverage=coverage
      
      # Convert coverage to lcov.info 
      - name: Convert coverage to lcov.info for ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d "lib" ]; then
            dart pub global activate coverage
            dart pub global run coverage:format_coverage \
              --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          fi
      
      # Store coverage artifacts for later combining  
      - name: Upload coverage artifacts for core
        if: hashFiles('${{ matrix.package }}/coverage/lcov.info') != '' && matrix.package == 'packages/rdf_vocabularies_core'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: ${{ matrix.package }}/coverage/lcov.info
          retention-days: 1
      
      - name: Upload coverage artifacts for schema
        if: hashFiles('${{ matrix.package }}/coverage/lcov.info') != '' && matrix.package == 'packages/rdf_vocabularies_schema'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-schema
          path: ${{ matrix.package }}/coverage/lcov.info
          retention-days: 1
      
      - name: Upload coverage artifacts for schema-http
        if: hashFiles('${{ matrix.package }}/coverage/lcov.info') != '' && matrix.package == 'packages/rdf_vocabularies_schema_http'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-schema-http
          path: ${{ matrix.package }}/coverage/lcov.info
          retention-days: 1
      
      - name: Upload coverage artifacts for meta
        if: hashFiles('${{ matrix.package }}/coverage/lcov.info') != '' && matrix.package == 'packages/rdf_vocabularies'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-meta
          path: ${{ matrix.package }}/coverage/lcov.info
          retention-days: 1

  # Combined coverage job for better monorepo support
  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Download all coverage artifacts
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true
      
      # List what we downloaded
      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find coverage-artifacts -name "*.info" -type f || echo "No .info files found"
          ls -la coverage-artifacts/ || echo "No coverage-artifacts directory"
      
      # Merge and upload coverage
      - name: Merge coverage files and upload to Codecov
        run: |
          mkdir -p coverage/combined
          
          # Check if we have any coverage files
          if find coverage-artifacts -name "*.info" -type f | head -1 | read; then
            echo "Found coverage files, merging..."
            
            # Copy and rename files to combined directory
            for file in coverage-artifacts/*.info; do
              if [ -f "$file" ]; then
                # Extract package name from artifact and copy file
                cp "$file" "coverage/combined/$(basename "$file")"
                echo "Copied: $file -> coverage/combined/$(basename "$file")"
              fi
            done
            
            # Adjust paths in each file to be relative to workspace root
            for file in coverage/combined/*.info; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                case "$filename" in
                  *core*)
                    sed -i 's|SF:lib/|SF:packages/rdf_vocabularies_core/lib/|g' "$file"
                    ;;
                  *schema-http*)
                    sed -i 's|SF:lib/|SF:packages/rdf_vocabularies_schema_http/lib/|g' "$file"
                    ;;
                  *schema*)
                    sed -i 's|SF:lib/|SF:packages/rdf_vocabularies_schema/lib/|g' "$file"
                    ;;
                  *meta*)
                    sed -i 's|SF:lib/|SF:packages/rdf_vocabularies/lib/|g' "$file"
                    ;;
                esac
                echo "Adjusted paths in: $file"
              fi
            done
            
            # Combine all files
            cat coverage/combined/*.info > coverage/combined/final.lcov.info
            
            echo "Combined coverage file created:"
            head -30 coverage/combined/final.lcov.info
            echo "..."
            echo "Total lines in combined file: $(wc -l < coverage/combined/final.lcov.info)"
            
            # Upload to Codecov
            echo "Uploading to Codecov..."
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov -f coverage/combined/final.lcov.info -t ${{ secrets.CODECOV_TOKEN }} -F combined
          else
            echo "No coverage files found to merge"
            exit 1
          fi

  # Additional job to run workspace-level operations
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      
      - name: Install workspace dependencies
        run: dart pub get
      
      - name: Run workspace tests (if any)
        run: |
          if [ -d "test" ]; then
            dart test
          else
            echo "No workspace-level tests found"
          fi
      
      - name: Run all package operations via tool
        run: dart run tool/all.dart test
