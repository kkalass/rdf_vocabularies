name: rdf_vocabularies_workspace
description: Workspace root for the RDF Vocabularies multi-package project. Contains all individual packages.
version: 0.4.0
publish_to: none  # This is a workspace root, not a publishable package

environment:
  sdk: ^3.7.0

# This is the workspace root for the multi-package RDF vocabularies project.
# The actual publishable packages are located in the packages/ directory:
# - packages/rdf_vocabularies: Meta-package that exports all vocabularies
# - packages/rdf_vocabularies_core: Core RDF vocabularies (RDF, RDFS, OWL, FOAF, etc.)
# - packages/rdf_vocabularies_schema: Schema.org HTTPS vocabulary
# - packages/rdf_vocabularies_schema_http: Schema.org HTTP vocabulary
